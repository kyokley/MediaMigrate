[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediamigrate"
version = "0.1.0"
description = "Safe, bounded MediaViewer migration to Backblaze B2"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mediamigrate = "mediamigrate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
